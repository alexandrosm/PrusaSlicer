name: Streamlining tooling

on:
  push:
  pull_request:
  workflow_dispatch:

# Fork PRs execute untrusted code only on disposable hosted runners. No secrets,
# write token, pull_request_target, reusable private workflow, or deployment.
permissions:
  contents: read

concurrency:
  group: streamlining-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tools:
    name: Windows tooling and mechanisms (CMake ${{ matrix.cmake }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cmake: ['3.31.6', '4.4.3']
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      # Official action tag -> commit identities verified through GitHub's API.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install small pinned tooling prerequisites (binary wheels only)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r .github/ci/requirements-windows-tools.txt
          if ($LASTEXITCODE -ne 0) { throw 'Tooling prerequisite installation failed' }
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cmake==${{ matrix.cmake }}'
          if ($LASTEXITCODE -ne 0) { throw 'Matrix CMake installation failed' }
      - name: Select wheel-verified native CMake and CTest
        run: |
          python -B .github/ci/select-native-cmake.py --github-path "$env:GITHUB_PATH" --report out/ci-bootstrap/native-cmake.json
          if ($LASTEXITCODE -ne 0) { throw 'Native CMake selection failed' }
      - name: Run compiler-free build fixtures and tiny native codec regression
        run: |
          $python = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          & .github/ci/run-windows-tools.ps1 -Python $python
      - name: Require real compiler-cache hits and PCH reuse after a header edit
        run: |
          & .github/ci/run-native-ci.ps1 -Python (Get-Command python).Source
      - name: Preserve compact logs, exact test outcomes, and mechanism evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: streamlining-windows-${{ matrix.cmake }}-${{ github.run_attempt }}
          path: |
            out/ci-streamlining/reports/
            out/ci-mechanisms/reports/
            out/ci-bootstrap/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

  geometry:
    name: Real geometry kernels (Windows)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned real geometry engines (binary wheels only)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r .github/ci/requirements-geometry.txt
          if ($LASTEXITCODE -ne 0) { throw 'Geometry prerequisite installation failed' }
      - name: Run all assigned real-kernel regressions without skips
        run: |
          & .github/ci/run-geometry-tests.ps1 -Python (Get-Command python).Source
      - name: Preserve compact geometry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: streamlining-geometry-${{ github.run_attempt }}
          path: out/ci-geometry/reports/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 1
